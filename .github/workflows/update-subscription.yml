name: Update Subscription

on:
  schedule:
    - cron: "5 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update filtered subscription
        run: python scripts/update_subscription.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update filtered subscription"
          file_pattern: subscriptions/*.txt subscriptions/*.json
